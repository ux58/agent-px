[package]
name = "agent-school-server"
version = "0.1.0"
edition = "2021"
description = "Agent 学堂后端：学习进度同步 API + 前端静态资源托管"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Postgres 存储（部署到无持久磁盘的平台时用，设 DATABASE_URL 启用）。
# rustls-ring：纯 Rust TLS + ring 加密库，musl 静态编译无需 openssl/cmake；
# 若所用 sqlx 版本提示 feature 不存在，退回 "tls-rustls"。
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }

[profile.release]
opt-level = 3
lto = true
strip = true
